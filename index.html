<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Class Fund</title>
</head>
<body style="margin:0;">
<div id="root"></div>

<!-- React + ReactDOM (production builds) -->
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<!-- Babel Standalone: transforms the JSX in app.jsx into real JS, live, in the browser -->
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<!-- Your actual app code, unchanged JSX — Babel compiles this on page load -->
<script type="text/babel" data-presets="react" src="app.jsx"></script>

<script type="text/babel" data-presets="react">
  const root = ReactDOM.createRoot(document.getElementById("root"));
  root.render(React.createElement(App));
</script>
</body>
</html>
