/* ---------- shared helpers ---------- */
const peso = (n) => "₱" + (n || 0).toLocaleString("en-PH");
const initials = (n) => n.split(" ").map((w) => w[0]).slice(0, 2).join("").toUpperCase();
const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
const nextRosterId = (roster) => {
  const max = roster.reduce((m, r) => {
    const n = parseInt(String(r.id).replace(/^A/, ""), 10);
    return Number.isNaN(n) ? m : Math.max(m, n);
  }, 0);
  return "A" + String(max + 1).padStart(3, "0");
};
const nextFileId = (files) => {
  const max = files.reduce((m, f) => {
    const n = parseInt(String(f.id).replace(/^F/, ""), 10);
    return Number.isNaN(n) ? m : Math.max(m, n);
  }, 0);
  return "F" + String(max + 1).padStart(3, "0");
};
// Entry-derived per-file totals — the one source of truth for "how much has this file actually collected".
// Used by both the File Detail dashboard and the Home dashboard so they never disagree.
const fileEntryTotals = (fileId, entriesByFile) => {
  const entries = entriesByFile[fileId] || [];
  const cash = entries.reduce((s, e) => s + e.amount_paid_cash, 0);
  const gcash = entries.reduce((s, e) => s + e.amount_paid_gcash, 0);
  return { cash, gcash, collected: cash + gcash };
};
const nextTransferId = (transfers) => {
  const max = transfers.reduce((m, t) => {
    const n = parseInt(String(t.id).replace(/^T/, ""), 10);
    return Number.isNaN(n) ? m : Math.max(m, n);
  }, 0);
  return "T" + String(max + 1).padStart(3, "0");
};
const nextLogId = (log) => {
  const max = log.reduce((m, l) => {
    const n = parseInt(String(l.id).replace(/^L/, ""), 10);
    return Number.isNaN(n) ? m : Math.max(m, n);
  }, 0);
  return "L" + String(max + 1).padStart(3, "0");
};

function FileCard({ f, onOpen, collected, transfers }) {
  const pct = f.goal_total ? Math.min(100, Math.round((collected / f.goal_total) * 100)) : 0;
  const borrowedOut = borrowedOutTotal(f.id, transfers);
  const borrowedIn = borrowedInTotal(f.id, transfers);
  return (
    <div className="cf-file-card" onClick={() => onOpen(f.id)}>
      <div className="top">
        <div>
          <div className="id">{f.id}</div>
          <h3>{f.name}</h3>
        </div>
        <span className={`cf-status-pill ${f.status}`}>{f.status === "open" ? "Open" : "Closed"}</span>
      </div>
      <div className="cf-progress-track"><div className="cf-progress-fill" style={{ width: `${pct}%` }} /></div>
      <div className="meta">
        <span>{peso(collected)} of {peso(f.goal_total)} · {pct}%</span>
        <span className="deadline">Due {f.deadline}</span>
      </div>
      {!!borrowedOut && (
        <div className="cf-transfer-line">
          <Icon name="transfer" size={13} strokeWidth={2.4} />
          Borrowed out: -{peso(borrowedOut)} · Available: {peso(collected - borrowedOut)}
        </div>
      )}
      {!!borrowedIn && (
        <div className="cf-transfer-line">
          <Icon name="transfer" size={13} strokeWidth={2.4} />
          Borrowed in: +{peso(borrowedIn)}
        </div>
      )}
    </div>
  );
}

// CBT (Checked by Treasurer) / CBA (Checked by Auditor) — two independent marks,
// not one shared checkmark, so it's visible whether Kiel, Angelea, both, or
// neither has reviewed an officer-made change. Only renders on records that
// actually carry these fields (i.e. records created/edited by an Officer).
// Toggling is restricted by role: only "treasurer" can flip CBT, only "auditor" can flip CBA.
function CheckBadges({ item, role, onToggleCBT, onToggleCBA }) {
  if (item.checked_by_treasurer === undefined) return null;
  const badge = (label, checked, canToggle, onClick) => (
    <span
      onClick={canToggle ? onClick : undefined}
      style={{
        fontSize: 10, fontWeight: 800, padding: "3px 9px", borderRadius: 999,
        background: checked ? "rgba(95,217,138,.18)" : "rgba(242,131,107,.16)",
        color: checked ? "var(--sprout)" : "var(--coral)",
        cursor: canToggle ? "pointer" : "default",
        border: `1px solid ${checked ? "var(--sprout-deep)" : "var(--coral-deep)"}`,
      }}
    >
      {label} {checked ? "✓" : "—"}
    </span>
  );
  return (
    <div style={{ display: "flex", gap: 6, marginTop: 8 }}>
      {badge("CBT", item.checked_by_treasurer, role === "treasurer", onToggleCBT)}
      {badge("CBA", item.checked_by_auditor, role === "auditor", onToggleCBA)}
    </div>
  );
}

function BottomSheet({ open, onClose, title, children }) {
  // Drag the handle down far enough (or flick it) to dismiss — not just decorative.
  const [dragY, setDragY] = useState(0);
  const draggingRef = useRef(false);
  const dragStartYRef = useRef(0);
  const sheetRef = useRef(null);

  useEffect(() => {
    if (open) setDragY(0);
  }, [open]);

  const onHandlePointerDown = (e) => {
    draggingRef.current = true;
    dragStartYRef.current = e.clientY;
  };
  useEffect(() => {
    const onMove = (e) => {
      if (!draggingRef.current) return;
      const delta = e.clientY - dragStartYRef.current;
      setDragY(Math.max(0, delta));
    };
    const onUp = () => {
      if (!draggingRef.current) return;
      draggingRef.current = false;
      const sheetHeight = sheetRef.current ? sheetRef.current.offsetHeight : 400;
      if (dragY > sheetHeight * 0.28) {
        onClose();
      }
      setDragY(0);
    };
    window.addEventListener("pointermove", onMove);
    window.addEventListener("pointerup", onUp);
    return () => {
      window.removeEventListener("pointermove", onMove);
      window.removeEventListener("pointerup", onUp);
    };
  }, [dragY, onClose]);

  return (
    <>
      <div className={`cf-overlay ${open ? "open" : ""}`} onClick={onClose} />
      <div
        ref={sheetRef}
        className={`cf-sheet ${open ? "open" : ""}`}
        style={open && dragY > 0 ? { transform: `translateY(${dragY}px)`, transition: "none" } : undefined}
      >
        <div className="cf-sheet-handle" onPointerDown={onHandlePointerDown} style={{ cursor: "grab", touchAction: "none" }} />
        {title && <h3>{title}</h3>}
        {children}
      </div>
    </>
  );
}

// Code gate: four fixed codes map to four roles. Not real security (anyone who
// knows a code can act as that role) — a proportionate choice for a small trusted
// officer group where the goal is catching honest mistakes, not stopping fraud.
const ROLE_CODES = { kiel: "treasurer", angelea: "auditor", "001": "officer", "999": "classmate" };

const sortedByName = (list) => [...list].sort((a, b) => a.name.localeCompare(b.name, "en", { sensitivity: "base" }));

// One button, click to cycle to the next sort mode — no separate explanation UI, the
// button's own label says what it's currently sorted by.
function SortToggle({ mode, options, onChange }) {
  const idx = options.findIndex((o) => o.id === mode);
  const current = options[idx] || options[0];
  const cycle = () => onChange(options[(idx + 1) % options.length].id);
  return (
    <button type="button" className="cf-chip" onClick={cycle} style={{ display: "inline-flex", alignItems: "center", gap: 6 }}>
      <Icon name="sort" size={13} strokeWidth={2.4} />
      {current.label}
    </button>
  );
}
const SORT_FNS = {
  alphabetical: (list, nameOf) => [...list].sort((a, b) => nameOf(a).localeCompare(nameOf(b), "en", { sensitivity: "base" })),
  date: (list) => [...list].sort((a, b) => new Date(a.created_at || 0) - new Date(b.created_at || 0)),
  deadline: (list) => [...list].sort((a, b) => new Date(a.deadline || "9999-12-31") - new Date(b.deadline || "9999-12-31")),
};

  const [roster, setRoster] = useState([]);

  const [activityLog, setActivityLog] = useState([]);
  const [transfers, setTransfers] = useState([]);
  const [rosterSortMode, setRosterSortMode] = useState("alphabetical");
  const [filesSortMode, setFilesSortMode] = useState("alphabetical");

  // Cross-device sync: each collection is mirrored from Firestore via a
  // real-time listener into the matching useState above. Every mutation
  // function below writes to Firestore FIRST and lets these listeners update
  // local state — never both a direct local mutation and a Firestore write
  // for the same action (that causes double-updates/flicker).
  useEffect(() => {
    if (!window.db) return;
    const unsub = window.db.collection("roster").onSnapshot(
      (snap) => setRoster(snap.docs.map((d) => d.data())),
      (err) => showBootError("Roster sync error: " + err.message)

  }, []);
  useEffect(() => {
    if (!window.db) return;
    const unsub = window.db.collection("files").onSnapshot(
      (snap) => setFiles(snap.docs.map((d) => d.data())),
      (err) => showBootError("Files sync error: " + err.message)
    );
    return unsub;
  }, []);
  useEffect(() => {
    if (!window.db) return;
    const unsub = window.db.collection("entries").onSnapshot(
      (snap) => {
        const grouped = {};
        snap.docs.forEach((d) => {
          const entry = d.data();
          if (!grouped[entry.file_id]) grouped[entry.file_id] = [];
          grouped[entry.file_id].push(entry);
        });
        setEntriesByFile(grouped);
      },
      (err) => showBootError("Entries sync error: " + err.message)

    return unsub;

  useEffect(() => {
    if (!window.db) return;

  // Excel Export (I1). No confirmed bundler/npm pipeline for this file yet (single-file,
  // mobile-built), so this uses a dependency-free CSV+Blob download rather than importing the
  // xlsx (SheetJS) library — Excel opens CSV natively. Columns mirror the on-screen entries
  // table exactly (name, full payment_status label, cash, gcash, total, expected, custom+reason).
  const exportFileEntriesCSV = (file, entries) => {
    const escape = (v) => {
      const s = String(v ?? "");
      return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
    };
    const header = ["Name", "Status", "Cash", "GCash", "Total Paid", "Expected", "Custom", "Custom Reason"];
    const rows = entries.map((e) => {
      const name = roster.find((r) => r.id === e.classmate_id)?.name ?? "Unknown";
      const total = e.amount_paid_cash + e.amount_paid_gcash;
      return [name, cap(e.payment_status), e.amount_paid_cash, e.amount_paid_gcash, total, e.expected_amount, e.custom ? "Yes" : "No", e.custom ? e.override_reason || "" : ""];
    });
    const csv = [header, ...rows].map((r) => r.map(escape).join(",")).join("\n");
    const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `${file.name.replace(/[^a-z0-9]+/gi, "_")}_${file.id}.csv`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    logActivity({ who: actorLabel, action_type: "export", target: file.id });
  };

  const [liveDefaultAmt, setLiveDefaultAmt] = useState(""); // powers the live "total needed" preview while creating a file
  const closeCreateFile = () => {
    setCreateFileOpen(false);
    setFileError("");
    setLiveDefaultAmt("");
    if (fileNameRef.current) fileNameRef.current.value = "";
    if (fileDescRef.current) fileDescRef.current.value = "";
    if (fileDefaultAmtRef.current) fileDefaultAmtRef.current.value = "";
    if (fileDeadlineRef.current) fileDeadlineRef.current.value = "";
    if (fileGoalRef.current) fileGoalRef.current.value = "";
  };
  const saveNewFile = (e) => {
    e.preventDefault();
    const name = fileNameRef.current.value.trim();
    const defaultAmount = parseFloat(fileDefaultAmtRef.current.value);
    if (!name) {
      setFileError("Enter a name for this file.");
      return;
    }
    if (Number.isNaN(defaultAmount) || defaultAmount < 0) {
      setFileError("Enter a default amount per person (0 or more).");
      return;
    }
    const description = fileDescRef.current.value.trim();
    const deadline = fileDeadlineRef.current.value;
    const goalRaw = fileGoalRef.current.value;

    if (!window.db) return;
    const fileId = nextFileId(files);
    const newFile = {
      id: fileId,
      name,
      description,
      default_amount: defaultAmount,
      deadline,
      goal_total: goalTotal,
      status: "open",
      created_at: new Date().toISOString(),
      ...(isOfficerActor ? { checked_by_treasurer: false, checked_by_auditor: false } : {}),
    };
    const newEntries = roster.map((r, i) => ({
      id: `${fileId}-E${String(i + 1).padStart(3, "0")}`,
      file_id: fileId,
      classmate_id: r.id,
      expected_amount: defaultAmount,
      override_reason: null,
      amount_paid_cash: 0,
      amount_paid_gcash: 0,
      payment_status: "unpaid",
      settlement_status: "pending",
      edit_history: [],
      custom: false,
    }));

    window.db.collection("files").doc(fileId).set(newFile);
    const batch = window.db.batch();
    newEntries.forEach((entry) => batch.set(window.db.collection("entries").doc(entry.id), entry));
    batch.commit();
    logActivity({ who: actorLabel, action_type: "file_create", target: fileId });
    closeCreateFile();
  };

  // File-level Advanced Settings — editing values that don't need to sit in the
  // open UI (default amount, goal, deadline, description) after a file already exists.
  const [editFileOpen, setEditFileOpen] = useState(null); // the file object being edited, or null
  const [editFileName, setEditFileName] = useState("");
  const [editFileDesc, setEditFileDesc] = useState("");
  const [editFileDefaultAmt, setEditFileDefaultAmt] = useState("");
  const [editFileGoal, setEditFileGoal] = useState("");
  const [editFileDeadline, setEditFileDeadline] = useState("");
  const [editFileError, setEditFileError] = useState("");
  const openEditFile = (file) => {
    setEditFileOpen(file);
    setEditFileName(file.name);
    setEditFileDesc(file.description || "");
    setEditFileDefaultAmt(String(file.default_amount));
    setEditFileGoal(String(file.goal_total));
    setEditFileDeadline(file.deadline || "");
    setEditFileError("");
  };
  const closeEditFile = () => setEditFileOpen(null);
  const saveEditFile = (e) => {
    e.preventDefault();
    const name = editFileName.trim();
    const defaultAmount = parseFloat(editFileDefaultAmt);
    const goalTotal = parseFloat(editFileGoal);
    if (!name) { setEditFileError("Enter a name for this file."); return; }
    if (Number.isNaN(defaultAmount) || defaultAmount < 0) { setEditFileError("Default amount must be 0 or more."); return; }
    if (Number.isNaN(goalTotal) || goalTotal < 0) { setEditFileError("Goal total must be 0 or more."); return; }
    if (!window.db) return;
    window.db.collection("files").doc(editFileOpen.id).update({
      name,
      description: editFileDesc.trim(),
      default_amount: defaultAmount,
      goal_total: goalTotal,
      deadline: editFileDeadline,
      ...(isOfficerActor ? { checked_by_treasurer: false, checked_by_auditor: false } : {}),
    });
    logActivity({ who: actorLabel, action_type: "file_settings_edit", target: editFileOpen.id });
    closeEditFile();
  };

  const closeNewTransfer = () => {
    setNewTransferOpen(false);
    setTransferFromId("");
    setTransferAmount("");
    setTransferReason("");
    setTransferError("");
    setTransferCoveredIds(new Set());
  };
  const openBorrowForFile = (fileId) => {
    setTransferToId(fileId);
    setNewTransferOpen(true);
  };
  const toggleTransferCoveredEntry = (entryId, remainingOwed) => {
    setTransferCoveredIds((prev) => {
      const next = new Set(prev);
      if (next.has(entryId)) next.delete(entryId);
      else next.add(entryId);
      // Auto-sum the amount from whichever entries are checked — still editable afterward.
      let sum = 0;
      const targetEntries = entriesByFile[transferToId] || [];
      targetEntries.forEach((en) => {
        if (next.has(en.id)) sum += Math.max(0, en.expected_amount - (en.amount_paid_cash + en.amount_paid_gcash));
      });
      setTransferAmount(String(sum));
      return next;
    });
  };
  const saveNewTransfer = (e) => {
    e.preventDefault();
    const amount = parseFloat(transferAmount);
    if (!transferFromId || !transferToId) {
      setTransferError("Pick which file this is borrowed from.");
      return;
    }
    if (transferFromId === transferToId) {
      setTransferError("Source and destination must be different files.");
      return;
    }
    if (Number.isNaN(amount) || amount <= 0) {
      setTransferError("Enter an amount greater than 0.");
      return;
    }
    if (!window.db) return;
    const coveredIds = Array.from(transferCoveredIds);
    const newTransfer = {
      id: nextTransferId(transfers),
      from_file_id: transferFromId,
      to_file_id: transferToId,
      amount,
      reason: transferReason.trim() || null,
      initiated_by: actorLabel,
      timestamp: new Date().toISOString(),
      status: "Borrowed",
      covered_entry_ids: coveredIds,
      ...(isOfficerActor ? { checked_by_treasurer: false, checked_by_auditor: false } : {}),
    };
    window.db.collection("transfers").doc(newTransfer.id).set(newTransfer);
    // Mark the specific covered entries gold — they show as "covered by borrowing" until
    // the classmate actually pays for real (see paymentDisplayState).
    coveredIds.forEach((entryId) => {
      const entry = (entriesByFile[transferToId] || []).find((en) => en.id === entryId);
      if (entry) writeEntryPayment(entry, { covered_by_borrowing: true });
    });
    logActivity({
      who: actorLabel,
      action_type: "transfer",
      target: newTransfer.id,
      from: transferFromId,
      to: transferToId,
      reason: newTransfer.reason,
    });
    // Borrowing is "big stuff" — pop a receipt (date/time/id), unlike routine payment marking.
    setReceiptModal(newTransfer);
    closeNewTransfer();
  };

  const closeAddPerson = () => {
    setAddPersonOpen(false);
    setNewPersonName("");
  };
  const saveNewPerson = (e) => {
    e.preventDefault();
    const name = newPersonName.trim();
    if (!name || !window.db) return;
    const id = nextRosterId(roster);
    const createdAt = new Date().toISOString();
    const newPerson = isOfficerActor
      ? { id, name, created_at: createdAt, checked_by_treasurer: false, checked_by_auditor: false }
      : { id, name, created_at: createdAt };
    window.db.collection("roster").doc(id).set(newPerson);
    logActivity({ who: actorLabel, action_type: "roster_add", target: name });
    closeAddPerson();
  };
  const removeRosterMember = (id) => {
    if (window.db) window.db.collection("roster").doc(id).delete();
  };

  const [editingEntry, setEditingEntry] = useState(null); // the entry object currently open in the Edit Entry sheet, or null
  const [editExpected, setEditExpected] = useState("");
  const [editOverrideReason, setEditOverrideReason] = useState("");
  const [editPaidCash, setEditPaidCash] = useState("");
  const [editPaidGcash, setEditPaidGcash] = useState("");
  const [editSettlementStatus, setEditSettlementStatus] = useState("pending");

  // Quick-pay: long-press an entry's payment button to fully mark it paid via
  // one method (no manual number entry) — for the common "no leftover" case.
  // Tap still opens the full manual edit sheet, same as the pencil icon.
  const [quickPayTarget, setQuickPayTarget] = useState(null); // { entry } while the picker is open
  const [quickPayPos, setQuickPayPos] = useState({ x: 0, y: 0 }); // anchor point (button center)
  const [quickPayHover, setQuickPayHover] = useState(null); // "gcash" | "cash" | "unpaid" | null
  const longPressTimerRef = useRef(null);
  const longPressStartRef = useRef({ x: 0, y: 0 });
  const longPressFiredRef = useRef(false);

  const paymentDisplayState = (entry) => {
    const total = entry.amount_paid_cash + entry.amount_paid_gcash;
    if (entry.covered_by_borrowing && total <= 0) return "borrowed";
    if (total <= 0) return "unpaid";
    if (entry.first_payment_method === "gcash") return "gcash";
    if (entry.first_payment_method === "cash") return "cash";
    // Fallback for entries with a payment but no recorded first method (e.g. older data).
    return entry.amount_paid_cash > 0 ? "cash" : "gcash";
  };

  const writeEntryPayment = (entry, updates) => {
    if (!window.db) return;
    const updated = { ...entry, ...updates, ...(isOfficerActor ? { checked_by_treasurer: false, checked_by_auditor: false } : {}) };
    window.db.collection("entries").doc(entry.id).set(updated);
  };

  const applyQuickPay = (entry, method) => {
    let updates;
    if (method === "unpaid") {
      updates = { amount_paid_cash: 0, amount_paid_gcash: 0, payment_status: "unpaid", first_payment_method: null, covered_by_borrowing: false };
    } else if (method === "gcash") {
      updates = { amount_paid_cash: 0, amount_paid_gcash: entry.expected_amount, payment_status: "paid", first_payment_method: "gcash", covered_by_borrowing: false };
    } else {
      updates = { amount_paid_cash: entry.expected_amount, amount_paid_gcash: 0, payment_status: "paid", first_payment_method: "cash", covered_by_borrowing: false };
    }
    writeEntryPayment(entry, updates);
    // Deliberately silent: routine payment marking doesn't pop a receipt/notification,
    // but it's still logged — logActivity feeds the Activity Log page either way.
    logActivity({ who: actorLabel, action_type: "entry_edit", target: entry.id, detail: `Quick-pay → ${method}` });
  };

  const QUICKPAY_HOLD_MS = 500;
  const QUICKPAY_MOVE_CANCEL_PX = 12; // finger drift before the hold starts that cancels a long-press
  const startLongPress = (entry, e) => {
    longPressStartRef.current = { x: e.clientX, y: e.clientY };
    longPressFiredRef.current = false;
    longPressTimerRef.current = setTimeout(() => {
      longPressFiredRef.current = true;
      // Clamp the whole cluster's anchor point so none of the 3 floating options
      // ever land off-screen, regardless of where on the page the button was.
      const margin = 120; // accounts for the ±78px option offset plus each circle's own ~34px radius
      const clampedX = Math.min(Math.max(e.clientX, margin), window.innerWidth - margin);
      const clampedY = Math.min(Math.max(e.clientY, 190), window.innerHeight - 60);
      setQuickPayTarget({ entry });
      setQuickPayPos({ x: clampedX, y: clampedY });
      setQuickPayHover(null);
    }, QUICKPAY_HOLD_MS);
  };
  const cancelLongPress = () => {
    if (longPressTimerRef.current) { clearTimeout(longPressTimerRef.current); longPressTimerRef.current = null; }
  };
  const handlePayPointerMove = (e) => {
    if (longPressTimerRef.current && !longPressFiredRef.current) {
      const dx = e.clientX - longPressStartRef.current.x;
      const dy = e.clientY - longPressStartRef.current.y;
      if (Math.sqrt(dx * dx + dy * dy) > QUICKPAY_MOVE_CANCEL_PX) cancelLongPress();
    }
  };
  const handlePayPointerUp = (entry) => {
    cancelLongPress();
    if (!longPressFiredRef.current) openEditEntry(entry); // plain tap — same as the pencil icon
    longPressFiredRef.current = false;
  };

  // While the quick-pay picker is open, track the pointer globally so dragging
  // across the three floating options highlights whichever one it's over, and
  // releasing anywhere applies the currently-highlighted option (or cancels).
  useEffect(() => {
    if (!quickPayTarget) return;
    const OPTION_RADIUS = 44; // half of .cf-quickpay-option's effective hit area, roughly
    const optionCenters = {
      gcash: { x: quickPayPos.x - 78, y: quickPayPos.y - 70 },
      cash: { x: quickPayPos.x + 78, y: quickPayPos.y - 70 },
      unpaid: { x: quickPayPos.x, y: quickPayPos.y - 150 },
    };
    const distanceTo = (p, point) => Math.sqrt((p.x - point.x) ** 2 + (p.y - point.y) ** 2);
    const onMove = (e) => {
      let closest = null;
      let closestDist = Infinity;
      Object.entries(optionCenters).forEach(([key, center]) => {
        const d = distanceTo(center, { x: e.clientX, y: e.clientY });
        if (d < OPTION_RADIUS * 1.6 && d < closestDist) { closest = key; closestDist = d; }
      });
      setQuickPayHover(closest);
    };
    const onUp = () => {
      if (quickPayHover) applyQuickPay(quickPayTarget.entry, quickPayHover);
      setQuickPayTarget(null);
      setQuickPayHover(null);
    };
    window.addEventListener("pointermove", onMove);
    window.addEventListener("pointerup", onUp);
    return () => {
      window.removeEventListener("pointermove", onMove);
      window.removeEventListener("pointerup", onUp);
    };
  }, [quickPayTarget, quickPayHover, quickPayPos]);

  const openEditEntry = (entry) => {
    setEditingEntry(entry);
    setEditExpected(String(entry.expected_amount));
    setEditOverrideReason(entry.override_reason || "");
    setEditPaidCash(String(entry.amount_paid_cash));
    setEditPaidGcash(String(entry.amount_paid_gcash));
    setEditSettlementStatus(entry.settlement_status);
  };
  const closeEditEntry = () => setEditingEntry(null);

  const saveEntryEdit = (e) => {
    e.preventDefault();
    if (!editingEntry) return;
    const file = files.find((f) => f.id === editingEntry.file_id);
    const newExpected = parseFloat(editExpected);
    if (Number.isNaN(newExpected)) return;
    const newPaidCash = parseFloat(editPaidCash) || 0;
    const newPaidGcash = parseFloat(editPaidGcash) || 0;
    const newOverrideReason = editOverrideReason.trim() || null;
    const newSettlementStatus = editSettlementStatus;
    const newCustom = file ? newExpected !== file.default_amount : editingEntry.custom;

    const totalPaid = newPaidCash + newPaidGcash;
    let newPaymentStatus;
    if (totalPaid <= 0) newPaymentStatus = "unpaid";
    else if (totalPaid < newExpected) newPaymentStatus = "partial";
    else if (totalPaid === newExpected) newPaymentStatus = "paid";
    else newPaymentStatus = "overpaid";

    const fieldDefs = [
      ["expected_amount", editingEntry.expected_amount, newExpected],
      ["override_reason", editingEntry.override_reason, newOverrideReason],
      ["amount_paid_cash", editingEntry.amount_paid_cash, newPaidCash],
      ["amount_paid_gcash", editingEntry.amount_paid_gcash, newPaidGcash],
      ["settlement_status", editingEntry.settlement_status, newSettlementStatus],
    ];
    const changed = fieldDefs.filter(([, oldV, newV]) => oldV !== newV);
    const historyEntry = changed.length
      ? {
          edited_by: actorLabel,
          timestamp: new Date().toISOString(),
          field_changed: changed.map(([field]) => field).join(", "),
          old_value: Object.fromEntries(changed.map(([field, oldV]) => [field, oldV])),
          new_value: Object.fromEntries(changed.map(([field, , newV]) => [field, newV])),
          reason: newOverrideReason,
        }
      : null;

    if (!window.db) return;
    const updatedEntry = {
      ...editingEntry,
      expected_amount: newExpected,
      override_reason: newOverrideReason,
      amount_paid_cash: newPaidCash,
      amount_paid_gcash: newPaidGcash,
      settlement_status: newSettlementStatus,
      payment_status: newPaymentStatus,
      custom: newCustom,
      edit_history: historyEntry ? [...editingEntry.edit_history, historyEntry] : editingEntry.edit_history,
      // An officer's edit re-flags for review even if this entry was previously checked;
      // treasurer/auditor edits never need their own sign-off.
      ...(isOfficerActor ? { checked_by_treasurer: false, checked_by_auditor: false } : {}),
    };
    window.db.collection("entries").doc(editingEntry.id).set(updatedEntry);
    if (historyEntry) {
      logActivity({
        who: actorLabel,
        action_type: "entry_edit",
        target: editingEntry.id,
        reason: historyEntry.reason,
        detail: `${historyEntry.field_changed}: ${JSON.stringify(historyEntry.old_value)} → ${JSON.stringify(historyEntry.new_value)}`,
      });
    }
    closeEditEntry();
  };

  // Auto-flip Borrowed → Repaid: recomputed from real data any time entries or files change,
  // no manual "mark repaid" action. If a transfer has specific covered_entry_ids (borrowed to
  // cover named classmates' shares), it's repaid once THOSE entries are actually paid for real —
  // more precise than the blanket rule, and matches "borrowed 336 because 2 classmates owe 168
  // each" resolving exactly when those two actually pay. Falls back to the blanket from-file
  // goal check for transfers with no specific coverage.
  useEffect(() => {
    if (!window.db) return;
    transfers.forEach((t) => {
      let shouldBeRepaid;
      if (t.covered_entry_ids && t.covered_entry_ids.length) {
        const toEntries = entriesByFile[t.to_file_id] || [];
        shouldBeRepaid = t.covered_entry_ids.every((entryId) => {
          const entry = toEntries.find((en) => en.id === entryId);
          if (!entry) return true; // entry no longer exists — don't block on it
          return entry.amount_paid_cash + entry.amount_paid_gcash >= entry.expected_amount;
        });
      } else {
        const fromFile = files.find((f) => f.id === t.from_file_id);
        if (!fromFile) return;
        const collected = fileEntryTotals(fromFile.id, entriesByFile).collected;
        shouldBeRepaid = collected >= fromFile.goal_total;
      }
      const newStatus = shouldBeRepaid ? "Repaid" : "Borrowed";
      if (newStatus !== t.status) {
        window.db.collection("transfers").doc(t.id).update({ status: newStatus });
      }
    });
  }, [files, entriesByFile, transfers]);

  // Reusable log-write function (F2). action_type/target/from/to are the filterable/display
  // fields; reason and detail are optional extra context. Writes straight to Firestore —
  // the activityLog useEffect listener above updates local state from the write.
  const logActivity = useCallback(({ who, action_type, target, from = null, to = null, reason = null, detail = null }) => {
    if (!window.db) return;
    const id = nextLogId(activityLog);
    window.db.collection("activityLog").doc(id).set({
      id,
      who,
      action_type,
      target,
      from,
      to,
      reason: reason ?? null,
      detail: detail ?? null,
      timestamp: new Date().toISOString(),
      reviewed: false,
    });
  }, [activityLog]);

  const toast = useCallback((msg) => {
    setToastMsg(msg);
    setToastShow(true);
    setTimeout(() => setToastShow(false), 2600);
  }, []);

  const goPage = (id) => { setScreen(id); setDrawerOpen(false); };
  const openFile = (id) => { setActiveFileId(id); setScreen("file-detail"); setDrawerOpen(false); };

  const openFiles = files.filter((f) => f.status === "open");
  const homeCollected = openFiles.reduce((s, f) => s + fileEntryTotals(f.id, entriesByFile).collected, 0);
  const homeGoal = openFiles.reduce((s, f) => s + f.goal_total, 0);
  const homePct = homeGoal ? Math.min(100, Math.round((homeCollected / homeGoal) * 100)) : 0;
  const totalDebt = openFiles.reduce((s, f) => s + Math.max(0, f.goal_total - fileEntryTotals(f.id, entriesByFile).collected), 0);
  const totalCash = files.reduce((s, f) => s + fileEntryTotals(f.id, entriesByFile).cash, 0);
  const totalGcash = files.reduce((s, f) => s + fileEntryTotals(f.id, entriesByFile).gcash, 0);

  const activeFile = files.find((f) => f.id === activeFileId);
  const activeEntries = activeFileId ? entriesByFile[activeFileId] || [] : [];
  const flaggedCount = activeEntries.filter((e) => e.custom).length;

  if (!role) {
    return (
      <div className="cf-root" style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", padding: 24 }}>
        <GlobalStyle />
        <form onSubmit={submitAuthCode} style={{ width: "100%", maxWidth: 320 }}>
          <div style={{ textAlign: "center", marginBottom: 24 }}>
            <div className="cf-drawer-title" style={{ display: "inline-flex", margin: "0 auto 14px" }}>
              <div className="badge">₱</div>
            </div>
            <div className="cf-display" style={{ fontSize: 22, fontWeight: 800 }}>Class Fund</div>
            <div style={{ color: "var(--dim)", fontSize: 13, marginTop: 4 }}>BSPHARM 1-Y1-1</div>
          </div>
          <div className="cf-sheet-field">
            <label htmlFor="cf-auth-code">Enter your code</label>
            <input
              id="cf-auth-code"
              type="text"
              autoFocus
              value={authCode}
              onChange={(e) => { setAuthCode(e.target.value); setAuthError(""); }}
              placeholder="Code"
            />
          </div>
          {authError && <div className="cf-sheet-hint" style={{ color: "var(--coral)" }}>{authError}</div>}
          <button type="submit" className="cf-btn cf-btn-primary" style={{ marginTop: 12 }}>Enter</button>
        </form>
      </div>
    );
  }

  if (role === "classmate" && !currentClassmateId) {
    return (
      <div className="cf-root" style={{ minHeight: "100vh", padding: 24 }}>
        <GlobalStyle />
        <div style={{ textAlign: "center", marginBottom: 20 }}>
          <div className="cf-display" style={{ fontSize: 20, fontWeight: 800 }}>Which one are you?</div>
          <div style={{ color: "var(--dim)", fontSize: 13, marginTop: 4 }}>Pick your name from the class list.</div>
        </div>
        {roster.length ? (
          <div className="cf-file-card" style={{ cursor: "default", padding: "6px 14px", maxWidth: 420, margin: "0 auto" }}>
            {sortedByName(roster).map((r) => (
              <div key={r.id} className="cf-roster-row" style={{ cursor: "pointer" }} onClick={() => setCurrentClassmateId(r.id)}>
                <div className="cf-avatar-dot" style={{ background: "var(--plum-raised)" }}>{initials(r.name)}</div>
                <div className="name">{r.name}</div>
              </div>
            ))}
          </div>
        ) : (
          <PlaceholderBox title="Wala pang list">Wala pang classmate na naitala — hintayin muna.</PlaceholderBox>
        )}
        <div style={{ textAlign: "center", marginTop: 16 }}>
          <button type="button" className="cf-btn cf-btn-ghost" style={{ maxWidth: 200, margin: "0 auto" }} onClick={signOut}>Back</button>
        </div>
      </div>
    );
  }

  return (
    <div className="cf-root">
      <GlobalStyle />

      <header className="cf-topbar">
        <button className="cf-icon-btn" onClick={() => setDrawerOpen(true)} aria-label="Open menu">
          <Icon name="menu" strokeWidth={2.4} />
        </button>
        <div className="cf-brand">
          <span className="name">Class Funds</span>
          <span className="sub">{PAGE_LABELS[screen] || "Home"}</span>
        </div>
      </header>

      <div className={`cf-overlay ${drawerOpen ? "open" : ""}`} onClick={() => setDrawerOpen(false)} />
      <nav className={`cf-drawer ${drawerOpen ? "open" : ""}`}>
        <div className="cf-drawer-title">
          <div className="badge">₱</div>
          <div style={{ flex: 1 }}>
            <div className="name">BSPHARM 1-Y1-1</div>
            <div className="sub">
              Signed in as {actorLabel}
              {role === "classmate" && currentClassmateId && ` (${roster.find((r) => r.id === currentClassmateId)?.name ?? ""})`}
            </div>
          </div>
          <button type="button" className="cf-icon-btn" style={{ width: 32, height: 32 }} onClick={signOut} aria-label="Switch code">
            <Icon name="back" size={15} strokeWidth={2.4} />
          </button>
        </div>
        {NAV_ITEMS.filter((item) => !item.hideFrom || !item.hideFrom.includes(role)).map((item) => (
          <button
            key={item.id}
            className={`cf-nav-item ${screen === item.id || (item.id === "files" && screen === "file-detail") ? "active" : ""}`}
            onClick={() => goPage(item.id)}
          >
            <Icon name={item.icon} />
            {item.label}
          </button>
        ))}
      </nav>

      <main className="cf-main">
        {screen === "home" && (
          <>
            {role === "classmate" ? (
              <>
                <div className="cf-back-row"><h2>Your Files</h2></div>
                {openFiles.length ? openFiles.map((f) => {
                  const myEntry = (entriesByFile[f.id] || []).find((en) => en.classmate_id === currentClassmateId);
                  const state = myEntry ? paymentDisplayState(myEntry) : "unpaid";
                  const label = !myEntry ? "No entry yet" : state === "borrowed" ? "Covered by borrowing" : cap(myEntry.payment_status);
                  return (
                    <div key={f.id} className="cf-file-card" onClick={() => openFile(f.id)}>
                      <div className="top">
                        <div>
                          <div className="id">{f.id}</div>
                          <h3>{f.name}</h3>
                        </div>

                        >
                          {isReviewed ? "Reviewed" : "Mark reviewed"}
                        </button>
                      </div>
                    );
                  })}
                </div>
              ) : (
                <PlaceholderBox title="Wala pa">Pakita muna kay Dela Torre nangyare</PlaceholderBox>
              );
            })()}
          </>
        )}

        {screen === "calendar" && (
          <>
            <div className="cf-back-row"><h2>Calendar</h2></div>
            <div className="cf-file-card" style={{ cursor: "default" }}>
              <h3 style={{ marginBottom: 2 }}>September 2026</h3>
              <div className="cf-cal-grid">
                {["S", "M", "T", "W", "T", "F", "S"].map((d, i) => <div className="cf-cal-dow" key={i}>{d}</div>)}
                {(() => {
                  // "Behind on collection" per spec: any open file whose real entry-derived
                  // total hasn't reached its goal yet — including zero collected, not just partial.
                  const behindOpenFiles = files.filter((f) => {
                    if (f.status !== "open") return false;
                    return fileEntryTotals(f.id, entriesByFile).collected < f.goal_total;
                  });
                  // day-of-month -> file ids, for the currently-rendered Sept 2026 grid.
                  const flagMap = {};
                  behindOpenFiles.forEach((f) => {
                    const d = new Date(f.deadline + "T00:00:00");
                    if (d.getFullYear() === 2026 && d.getMonth() === 8) {
                      const day = d.getDate();
                      (flagMap[day] = flagMap[day] || []).push(f.id);
                    }
                  });
                  const firstDow = new Date(2026, 8, 1).getDay();
                  const cells = [];
                  for (let i = 0; i < firstDow; i++) cells.push(<div className="cf-cal-cell empty" key={`e${i}`} />);
                  for (let d = 1; d <= 30; d++) {
                    const fileIds = flagMap[d];
                    cells.push(
                      <div
                        className={`cf-cal-cell ${fileIds ? "flag" : ""}`}
                        key={d}
                        onClick={fileIds ? () => openFile(fileIds[0]) : undefined}
                        style={fileIds ? { cursor: "pointer" } : undefined}
                      >
                        {d}
                      </div>
                    );
                  }
                  return cells;
                })()}
              </div>
              <div className="cf-cal-legend">
                <div className="item"><div className="sw" style={{ background: "var(--coral)" }} />Deadline, behind goal</div>
              </div>
            </div>
          </>
        )}

        {screen === "roster" && (
          <>
            <div className="cf-back-row">
              <h2>Class List</h2>
              <div style={{ marginLeft: "auto" }}>
                <SortToggle
                  mode={rosterSortMode}
                  onChange={setRosterSortMode}
                  options={[
                    { id: "alphabetical", label: "A–Z" },
                    { id: "date", label: "Date added" },
                  ]}
                />
              </div>
            </div>
            {roster.length ? (
              <div className="cf-file-card" style={{ cursor: "default", padding: "6px 14px" }}>
                {(rosterSortMode === "alphabetical" ? sortedByName(roster) : SORT_FNS.date(roster)).map((r) => (
                  <div className="cf-roster-row" key={r.id} style={{ flexWrap: "wrap" }}>
                    <div className="cf-avatar-dot" style={{ background: "var(--plum-raised)" }}>{initials(r.name)}</div>
                    <div className="name">{r.name}{role === "classmate" && r.id === currentClassmateId ? " (You)" : ""}</div>
                    <div className="files-count">{r.id}</div>
                    {canEdit && (
                      <div className="cf-edit-btn" onClick={() => removeRosterMember(r.id)} aria-label={`Remove ${r.name}`}>
                        <Icon name="trash" size={15} />
                      </div>
                    )}
                    <div style={{ width: "100%" }}>
                      <CheckBadges
                        item={r}
                        role={role}
                        onToggleCBT={() => toggleRosterCheck(r.id, "checked_by_treasurer")}
                        onToggleCBA={() => toggleRosterCheck(r.id, "checked_by_auditor")}
                      />
                    </div>
                  </div>
                ))}
              </div>
            ) : <PlaceholderBox title="Wala pang list">Dagdag classmate</PlaceholderBox>}
            {canEdit && <button className="cf-btn cf-btn-ghost" style={{ marginTop: 12 }} onClick={() => setAddPersonOpen(true)}>+ Add Person</button>}

            <BottomSheet open={addPersonOpen} onClose={closeAddPerson} title="Add Person">
              <form onSubmit={saveNewPerson}>
                <div className="cf-sheet-field">
                  <label htmlFor="cf-add-person-name">Name</label>
                  <input
                    id="cf-add-person-name"
                    type="text"
                    placeholder="e.g. John lorenze"
                    autoFocus
                    value={newPersonName}
                    onChange={(e) => setNewPersonName(e.target.value)}
                  />
                </div>
                <button type="submit" className="cf-btn cf-btn-primary">Save</button>
              </form>
            </BottomSheet>
          </>
        )}

        {screen === "settings" && (
          <>
            <div className="cf-back-row"><h2>Settings</h2></div>
            <PlaceholderBox title="D ko alam lalagay dito, placeholder lang pag napagtripan ko">😅</PlaceholderBox>
          </>
        )}
      </main>

      <div className={`cf-toast ${toastShow ? "show" : ""}`}>{toastMsg}</div>

      <BottomSheet open={newTransferOpen} onClose={closeNewTransfer} title="Borrow Between Files">
        <form onSubmit={saveNewTransfer}>
          <div className="cf-sheet-field">
            <label>Borrowing into</label>
            <input type="text" value={files.find((f) => f.id === transferToId)?.name ?? ""} disabled />
          </div>
          <div className="cf-sheet-field">
            <label htmlFor="cf-transfer-from">Borrow from which file?</label>
            <select
              id="cf-transfer-from"
              value={transferFromId}
              onChange={(e) => { setTransferFromId(e.target.value); setTransferError(""); }}
            >
              <option value="">Select a file…</option>
              {files.filter((f) => f.id !== transferToId).map((f) => <option key={f.id} value={f.id}>{f.name}</option>)}
            </select>
          </div>
          {(entriesByFile[transferToId] || []).some((en) => en.amount_paid_cash + en.amount_paid_gcash < en.expected_amount) && (
            <div className="cf-sheet-field">
              <label>Which classmates does this cover? (optional)</label>
              <div className="cf-sheet-hint" style={{ marginBottom: 6 }}>Checking someone shows a gold "covered by borrowing" mark on their entry until they actually pay — auto-fills the amount below.</div>
              {(entriesByFile[transferToId] || [])
                .filter((en) => en.amount_paid_cash + en.amount_paid_gcash < en.expected_amount)
                .map((en) => {
                  const owed = en.expected_amount - (en.amount_paid_cash + en.amount_paid_gcash);
                  const nm = roster.find((r) => r.id === en.classmate_id)?.name ?? "Unknown";
                  return (
                    <label key={en.id} style={{ display: "flex", alignItems: "center", gap: 8, padding: "6px 0", fontSize: 13 }}>
                      <input type="checkbox" checked={transferCoveredIds.has(en.id)} onChange={() => toggleTransferCoveredEntry(en.id, owed)} />
                      {nm} — owes {peso(owed)}
                    </label>
                  );
                })}
            </div>
          )}
          <div className="cf-sheet-field">
            <label htmlFor="cf-transfer-amount">Amount</label>
            <input
              id="cf-transfer-amount"
              type="number"
              min="0"
              step="0.01"
              placeholder="0.00"
              value={transferAmount}
              onChange={(e) => { setTransferAmount(e.target.value); setTransferError(""); }}
            />
          </div>
          <div className="cf-sheet-field">
            <label htmlFor="cf-transfer-reason">Reason (optional)</label>
            <input
              id="cf-transfer-reason"
              type="text"
              placeholder="bakit manghihiram🤨"
              value={transferReason}
              onChange={(e) => setTransferReason(e.target.value)}
            />
          </div>
          {transferError && <div className="cf-sheet-hint" style={{ color: "var(--coral)" }}>{transferError}</div>}
          <div className="cf-sheet-actions">
            <button type="button" className="cf-btn cf-btn-ghost" onClick={closeNewTransfer}>Cancel</button>
            <button type="submit" className="cf-btn cf-btn-primary">Save</button>
          </div>
        </form>
      </BottomSheet>

      {receiptModal && (
        <>
          <div className="cf-quickpay-overlay" onClick={() => setReceiptModal(null)} />
          <div
            className="cf-file-card"
            style={{
              position: "fixed", top: "50%", left: "50%", transform: "translate(-50%, -50%)",
              zIndex: 72, width: "min(340px, 86vw)", cursor: "default",
            }}
          >
            <div className="cf-receipt-row" style={{ justifyContent: "center", marginBottom: 4 }}>
              <Icon name="transfer" strokeWidth={2.2} />
            </div>
            <div style={{ textAlign: "center", fontFamily: "var(--font-display)", fontWeight: 800, fontSize: 16, marginBottom: 10 }}>
              Borrowing Receipt
            </div>
            <div className="cf-receipt-row">
              <span className="file-name">{files.find((f) => f.id === receiptModal.from_file_id)?.name ?? "Unknown"}</span>
              <Icon name="transfer" strokeWidth={2.2} />
              <span className="file-name">{files.find((f) => f.id === receiptModal.to_file_id)?.name ?? "Unknown"}</span>
            </div>
            <div className="cf-receipt-amount">{peso(receiptModal.amount)}</div>
            {receiptModal.reason && <div className="cf-receipt-reason">{receiptModal.reason}</div>}
            <div className="cf-receipt-meta">
              <span>{new Date(receiptModal.timestamp).toLocaleString("en-PH", { month: "short", day: "numeric", year: "numeric", hour: "numeric", minute: "2-digit" })}</span>
              <span className="cf-status-pill open">{receiptModal.id}</span>
            </div>
            <button type="button" className="cf-btn cf-btn-primary" style={{ marginTop: 12 }} onClick={() => setReceiptModal(null)}>Close</button>
          </div>
        </>
      )}

      {quickPayTarget && (
        <>
          <div className="cf-quickpay-overlay" />
          <div className="cf-quickpay-picker" style={{ left: quickPayPos.x - 78, top: quickPayPos.y - 70 }}>
            <div className={`cf-quickpay-option gcash ${quickPayHover === "gcash" ? "active" : ""}`}><Icon name="qpGcash" size={20} strokeWidth={2.2} />GCash</div>
          </div>
          <div className="cf-quickpay-picker" style={{ left: quickPayPos.x + 78, top: quickPayPos.y - 70 }}>
            <div className={`cf-quickpay-option cash ${quickPayHover === "cash" ? "active" : ""}`}><Icon name="qpCash" size={20} strokeWidth={2.2} />Cash</div>
          </div>
          <div className="cf-quickpay-picker" style={{ left: quickPayPos.x, top: quickPayPos.y - 150 }}>
            <div className={`cf-quickpay-option unpaid ${quickPayHover === "unpaid" ? "active" : ""}`}><Icon name="qpX" size={20} strokeWidth={2.6} />Unpaid</div>
          </div>
        </>
      )}
    </div>
  );
}
